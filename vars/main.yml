---

# -----------------------------------------------------------------------------
# distro / os handles
# -----------------------------------------------------------------------------

__hosts_distro: >-
  {{ ansible_facts.distribution | lower }}

__hosts_os: >-
  {{ ansible_facts.os_family | lower }}

__hosts_distro_version: >-
  {{ __hosts_distro }}_{{ ansible_facts.distribution_major_version }}

__hosts_os_version: >-
  {{ __hosts_os }}_{{ ansible_facts.distribution_major_version }}

# -----------------------------------------------------------------------------
# first found snippets
# -----------------------------------------------------------------------------

__hosts_first_found:
  - '{{ __hosts_distro_version }}'
  - '{{ __hosts_os_version }}'
  - '{{ __hosts_distro }}'
  - '{{ __hosts_os }}'
  - default

__hosts_etc_templates:
  files: >-
    {{
      __hosts_first_found |
        map('regex_replace', '^', 'hosts_') |
        map('regex_replace', '$', '.j2') |
        list
    }}
  paths:
    - templates

...
